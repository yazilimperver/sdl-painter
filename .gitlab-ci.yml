stages:
  - build
  - test
  - quality
  - docs
  - release

variables:
  CONAN_HOME: "/root/.conan2"
  GIT_SUBMODULE_STRATEGY: recursive

# --- Build Stage ---
build:linux:debug:
  stage: build
  image: $CI_REGISTRY_IMAGE 
  script:
    - |
      conan install . --output-folder=build/linux-debug/generators --build=missing \
        -s build_type=Debug \
        -o "&:with_vulkan=True" \
        -c tools.system.package_manager:mode=install \
        -c tools.system.package_manager:sudo=False
    - cmake --preset linux-debug
    - cmake --build --preset linux-debug
  artifacts:
    paths:
      - build/linux-debug/
    expire_in: 1 day

build:linux:release:
  stage: build
  image: $CI_REGISTRY_IMAGE
  script:
    - |
      conan install . --output-folder=build/linux-release/generators --build=missing \
        -s build_type=Release \
        -o "&:with_vulkan=True" \
        -c tools.system.package_manager:mode=install \
        -c tools.system.package_manager:sudo=False
    - cmake --preset linux-release
    - cmake --build --preset linux-release
  artifacts:
    paths:
      - build/linux-release/
    expire_in: 1 day

build:windows:debug:
  stage: build
  image: $CI_REGISTRY_IMAGE/sdl-painter-win
  script:
    - conan install . --output-folder=build/windows-mingw-debug/generators  --build=missing -s build_type=Debug --profile:build=default --profile:host=windows-mingw
    - cmake --preset windows-mingw-debug
    - cmake --build --preset windows-mingw-debug
  artifacts:
    paths:
      - build/windows-mingw-debug/
    expire_in: 1 day

build:windows:release:
  stage: build
  image: $CI_REGISTRY_IMAGE/sdl-painter-win
  script:
    - conan install . --output-folder=build/windows-mingw-release/generators  --build=missing -s build_type=Release --profile:build=default --profile:host=windows-mingw
    - cmake --preset windows-mingw-release
    - cmake --build --preset windows-mingw-release
  artifacts:
    paths:
      - build/windows-mingw-release/
    expire_in: 1 day

# # --- Test Stage ---
# # Linux: SDL_VIDEODRIVER=offscreen + lavapipe (mesa-vulkan-drivers) ile headless çalışır.
# # Windows: SDL_VIDEODRIVER=offscreen; Vulkan için sistem Vulkan ICD'si kullanılır.
test:unit:
  stage: test
  image: $CI_REGISTRY_IMAGE
  needs: ["build:linux:debug"]
  variables:
    SDL_VIDEODRIVER: "offscreen"
    VK_ICD_FILENAMES: "/usr/share/vulkan/icd.d/lvp_icd.x86_64.json"
  script:
    - ctest --preset linux-debug --output-on-failure

test:unit:asan:
  stage: test
  image: $CI_REGISTRY_IMAGE
  variables:
    SDL_VIDEODRIVER: "offscreen"
    VK_ICD_FILENAMES: "/usr/share/vulkan/icd.d/lvp_icd.x86_64.json"
  script:
    - |
      conan install . --output-folder=build/linux-debug-asan/generators --build=missing \
        -s build_type=Debug \
        -c tools.system.package_manager:mode=install \
        -c tools.system.package_manager:sudo=False
    - cmake --preset linux-debug-asan
    - cmake --build --preset linux-debug-asan
    - ctest --preset linux-debug-asan --output-on-failure

