stages:
  - build
  - test
  - quality
  - docs
  - release

variables:
  CONAN_HOME: "/root/.conan2"
  GIT_SUBMODULE_STRATEGY: recursive

# --- Build Stage ---
build:linux:debug:
  stage: build
  image: $CI_REGISTRY_IMAGE 
  script:
    - |
      conan install . --output-folder=build/linux-debug/generators --build=missing \
        -s build_type=Debug \
        -o "&:with_vulkan=True" \
        -c tools.system.package_manager:mode=install \
        -c tools.system.package_manager:sudo=False
    - cmake --preset linux-debug
    - cmake --build --preset linux-debug
  artifacts:
    paths:
      - build/linux-debug/libsdl_painter.a
      - build/linux-debug/tests/sdl_painter_tests
      - build/linux-debug/examples/*
    exclude:
      - build/linux-debug/examples/CMakeFiles/**/*
      - build/linux-debug/examples/*.cmake
    expire_in: 1 day

build:linux:release:
  stage: build
  image: $CI_REGISTRY_IMAGE
  script:
    - |
      conan install . --output-folder=build/linux-release/generators --build=missing \
        -s build_type=Release \
        -o "&:with_vulkan=True" \
        -c tools.system.package_manager:mode=install \
        -c tools.system.package_manager:sudo=False
    - cmake --preset linux-release
    - cmake --build --preset linux-release
  artifacts:
    paths:
      - build/linux-debug/libsdl_painter.a
      - build/linux-release/tests/sdl_painter_tests
      - build/linux-release/examples/*
    exclude:
      - build/linux-release/examples/CMakeFiles/**/*
      - build/linux-release/examples/*.cmake
    expire_in: 1 day

build:windows:debug:
  stage: build
  image: $CI_REGISTRY_IMAGE/sdl-painter-win-cross
  script:
    - conan install . --output-folder=build/windows-mingw-debug/generators  --build=missing -s build_type=Debug --profile:build=default --profile:host=windows-mingw
    - cmake --preset windows-mingw-debug
    - cmake --build --preset windows-mingw-debug

build:windows:release:
  stage: build
  image: $CI_REGISTRY_IMAGE/sdl-painter-win-cross
  script:
    - conan install . --output-folder=build/windows-mingw-release/generators  --build=missing -s build_type=Release --profile:build=default --profile:host=windows-mingw
    - cmake --preset windows-mingw-release
    - cmake --build --preset windows-mingw-release

# # --- Test Stage ---
# # Linux: SDL_VIDEODRIVER=offscreen + lavapipe (mesa-vulkan-drivers) ile headless çalışır.
# # Windows: SDL_VIDEODRIVER=offscreen; Vulkan için sistem Vulkan ICD'si kullanılır.
test:unit:
  stage: test
  image: $CI_REGISTRY_IMAGE
  needs: ["build:linux:debug"]
  variables:
    SDL_VIDEODRIVER: "offscreen"
  script:
    # lavapipe ICD dosya adi mesa surumune gore degisiyor
    # (lvp_icd.json / lvp_icd.x86_64.json). Sabit yol yanlissa loader
    # HIC surucu yuklemiyor ve Vulkan testleri sessizce SKIP oluyor.
    - export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
    - echo "lavapipe ICD=${VK_ICD_FILENAMES:-<bulunamadi, loader varsayilani>}"
    - ctest --preset linux-debug --output-on-failure

test:unit:asan:
  stage: test
  image: $CI_REGISTRY_IMAGE
  # Kendi conan+cmake build'ini yapar, build-stage artifact'ı tüketmez.
  # needs: [] → pipeline başında bağımsız çalışsın; alakasız bir build
  # job'ının (örn. windows MinGW) fail'i bunu SKIP ettirmesin.
  needs: []
  variables:
    SDL_VIDEODRIVER: "offscreen"
  script:
    # lavapipe ICD dosya adi mesa surumune gore degisiyor
    # (lvp_icd.json / lvp_icd.x86_64.json). Sabit yol yanlissa loader
    # HIC surucu yuklemiyor ve Vulkan testleri sessizce SKIP oluyor.
    - export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
    - echo "lavapipe ICD=${VK_ICD_FILENAMES:-<bulunamadi, loader varsayilani>}"
    - |
      conan install . --output-folder=build/linux-debug-asan/generators --build=missing \
        -s build_type=Debug \
        -c tools.system.package_manager:mode=install \
        -c tools.system.package_manager:sudo=False
    - cmake --preset linux-debug-asan
    - cmake --build --preset linux-debug-asan
    - ctest --preset linux-debug-asan --output-on-failure

