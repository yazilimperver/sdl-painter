quality:clang-format:
  stage: quality
  image: $CI_REGISTRY_IMAGE
  before_script:
    - apt-get update && apt-get install -y clang-format-18
  script:
    - find include/ src/ -name '*.h' -o -name '*.cpp' | xargs clang-format-18 --dry-run --Werror
  allow_failure: true

quality:clang-tidy:
  stage: quality
  image: $CI_REGISTRY_IMAGE
  needs: ["build:linux:debug"]
  before_script:
    - apt-get install -y clang-tidy-18
  script:
    - find src/ -name '*.cpp' | xargs clang-tidy-18 -p build/linux-debug/
  allow_failure: true

# --- Docs Stage ---

# GitLab Pages: job adı 'pages' olmalı, artifact 'public/' altına gitmeli.
# Conan/CMake gerektirmez — doxygen doğrudan include/ ve doc/ üzerinde çalışır.
pages:
  stage: docs
  image: ubuntu:24.04
  needs: []
  before_script:
    - apt-get update -qq && apt-get install -y doxygen graphviz
  script:
    - mkdir -p public
    - |
      AWESOME="third_party/doxygen-awesome-css/doxygen-awesome.css"
      [ -f "$AWESOME" ] || AWESOME=""
      cat > _ci_doxyfile <<EOF
      PROJECT_NAME           = "SDLPainter"
      PROJECT_NUMBER         = "$(grep 'project(SDLPainter VERSION' CMakeLists.txt | grep -oP '\d+\.\d+\.\d+')"
      PROJECT_BRIEF          = "QPainter benzeri SDL3 + OpenGL/Vulkan 2D çizim kütüphanesi"
      OUTPUT_DIRECTORY       = public
      HTML_OUTPUT            = .
      INPUT                  = include/sdl_painter doc
      FILE_PATTERNS          = *.h *.md
      RECURSIVE              = YES
      USE_MDFILE_AS_MAINPAGE = doc/README.md
      EXCLUDE_PATTERNS       = */src/* */tests/* */examples/* */third_party/*
      EXTRACT_ALL            = NO
      EXTRACT_PRIVATE        = NO
      EXTRACT_STATIC         = YES
      HIDE_UNDOC_MEMBERS     = YES
      HIDE_UNDOC_CLASSES     = YES
      GENERATE_HTML          = YES
      GENERATE_LATEX         = NO
      HTML_EXTRA_STYLESHEET  = $AWESOME
      HTML_COLORSTYLE        = LIGHT
      HTML_TIMESTAMP         = NO
      HAVE_DOT               = YES
      DOT_IMAGE_FORMAT       = svg
      INTERACTIVE_SVG        = YES
      CLASS_GRAPH            = YES
      COLLABORATION_GRAPH    = NO
      CALL_GRAPH             = NO
      QUIET                  = YES
      WARNINGS               = YES
      WARN_IF_UNDOCUMENTED   = YES
      WARN_NO_PARAMDOC       = YES
      OUTPUT_LANGUAGE        = Turkish
      SEARCHENGINE           = YES
      EOF
    - doxygen _ci_doxyfile
  artifacts:
    paths:
      - public/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --- Release Stage ---
release:publish:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "SDLPainter $CI_COMMIT_TAG"
    description: ./CHANGELOG.md
