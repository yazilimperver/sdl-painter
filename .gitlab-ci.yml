# Kod kapsama olcumu. Esik ZORLANMAZ (allow_failure): amac kapsami gorunur
# kilmak. gcovr'in "lines: N%" ciktisi GitLab'in kapsam rozetini besler.
# NOT: gcovr imajda apt ile zaten kurulu (bkz. Dockerfile ci stage).
quality:coverage:
  stage: quality
  image: $CI_REGISTRY_IMAGE
  needs: []
  variables:
    SDL_VIDEODRIVER: "offscreen"
    # Font yoksa metin testleri sessizce atlanmasin, HATA versin.
    SDLPAINTER_REQUIRE_FONT: "1"
  script:
    - |
      # Metin testleri gercek bir TTF ister; imaj yeniden derlenene kadar burada kurulur.
      FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      if [ ! -f "$FONT" ]; then
        apt-get update -qq && apt-get install -y --no-install-recommends fonts-dejavu-core
      fi
      ls -l "$FONT"
    - export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
    - |
      conan install . --output-folder=build/linux-debug-coverage/generators --build=missing \
        -s build_type=Debug \
        -o "&:with_vulkan=True" \
        -c tools.system.package_manager:mode=install \
        -c tools.system.package_manager:sudo=False
    - cmake --preset linux-debug-coverage
    - cmake --build --preset linux-debug-coverage
    - ctest --preset linux-debug-coverage --output-on-failure
    # gcov, .gcda dosyalarini ureten derleyiciyle AYNI ana surumden olmali.
    # Imaj Debian 13 tabanli: build-essential GCC 14 getiriyor ve /usr/bin/gcov
    # gcov-14 oluyor; ancak Dockerfile gcc/g++'i 13'e sabitliyor (gcov'u
    # sabitlemiyor). Uyusmazlikta gcov cikis kodu 3 veriyor ve gcovr
    # "could not infer a working directory" hatasiyla duser.
    - |
      CACHE=build/linux-debug-coverage/CMakeCache.txt
      CXX=$(sed -n 's/^CMAKE_CXX_COMPILER:[^=]*=//p' "$CACHE")
      echo "CMake derleyicisi: $CXX"
      "$CXX" --version | head -1
      MAJOR=$("$CXX" -dumpfullversion -dumpversion 2>/dev/null | cut -d. -f1)
      if command -v "gcov-$MAJOR" >/dev/null 2>&1; then
        GCOV_EXECUTABLE="gcov-$MAJOR"
      else
        GCOV_EXECUTABLE=gcov
      fi
      export GCOV_EXECUTABLE
      echo "Secilen gcov: $GCOV_EXECUTABLE"
      mkdir -p coverage
      # Yalnizca kutuphane kodu olculur; testler/ornekler kapsam disi.
      gcovr --root . \
        --gcov-executable "$GCOV_EXECUTABLE" \
        --filter 'src/' --filter 'include/sdl_painter/' \
        --exclude 'tests/' --exclude 'examples/' --exclude 'third_party/' \
        --exclude-unreachable-branches \
        --print-summary \
        --html-details coverage/index.html \
        --xml coverage/coverage.xml
  coverage: '/^lines:\s+(\d+\.\d+)\%/'
  artifacts:
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/coverage.xml
    expire_in: 1 week
  allow_failure: true

# --- Paketleme yolu ---------------------------------------------------------
#
# Aşağıdaki dört job uzun süre YALNIZCA GitHub'da vardı. Sonuç: GitLab
# pipeline'ı paketleme yolunu hiç doğrulamıyordu ve "iki pipeline aynı şeyi
# kontrol ediyor" varsayımı yanlıştı. Yeni bir job eklerken "yalnızca birine
# eklemek yeterli mi?" sorusunu açıkça cevaplayın (bkz. .claude/rules/ci-cd.md).

# Preset KULLANMADAN, örnek/test KAPALI derleme + install + find_package ile
# tüketici doğrulaması. Kütüphaneyi dışarıdan kullanmanın gerçek yolu bu; preset
# üzerinden derlemek onu doğrulamıyor.
build:standalone-cmake:
  stage: build
  image: $CI_REGISTRY_IMAGE
  needs: []
  script:
    - |
      conan install . --output-folder=build/standalone/generators --build=missing \
        -s build_type=Release \
        -o "&:with_vulkan=True" \
        -c tools.system.package_manager:mode=install \
        -c tools.system.package_manager:sudo=False
    - |
      TC=$(find build/standalone/generators -name conan_toolchain.cmake | head -1)
      echo "toolchain: $TC"
      cmake -S . -B build/standalone/out \
        -DCMAKE_TOOLCHAIN_FILE="$PWD/$TC" \
        -DCMAKE_BUILD_TYPE=Release \
        -DSDLPAINTER_WITH_VULKAN=ON \
        -DSDLPAINTER_BUILD_EXAMPLES=OFF \
        -DSDLPAINTER_BUILD_TESTS=OFF
      cmake --build build/standalone/out
    - |
      cmake --install build/standalone/out --prefix "$PWD/build/standalone/prefix"
      TC=$(find build/standalone/generators -name conan_toolchain.cmake | head -1)
      cmake -S packaging/consumer -B build/standalone/consumer \
        -DCMAKE_TOOLCHAIN_FILE="$PWD/$TC" \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_PREFIX_PATH="$PWD/build/standalone/prefix" \
        -DCONSUMER_MODE=find_package
      cmake --build build/standalone/consumer
      ./build/standalone/consumer/consumer

# Paylaşımlı (shared) kütüphane yolu. Bu job olmadan sessizce bozuluyordu:
# Windows/MSVC export işaretlemesi olmadan .dll üretip .lib ÜRETMİYOR, yani
# hiçbir tüketici link edemiyor. Linux'ta varsayılan sembol görünürlüğü bunu
# gizlediği için fark edilmemişti. Conan Center shared derlemeyi zorunlu
# olarak test ediyor.
#
# sdl_painter_tests bu modda bilinçli olarak ATLANIR (dahili sembollere
# erişir); public yüzeyi sdl_painter_abi_tests doğrular.
build:shared:
  stage: build
  image: $CI_REGISTRY_IMAGE
  needs: []
  variables:
    SDL_VIDEODRIVER: "offscreen"
  script:
    - |
      conan install . --output-folder=build/shared/generators --build=missing \
        -s build_type=Release \
        -o "&:with_vulkan=True" \
        -c tools.system.package_manager:mode=install \
        -c tools.system.package_manager:sudo=False
    - |
      TC=$(find build/shared/generators -name conan_toolchain.cmake | head -1)
      cmake -S . -B build/shared/out \
        -DCMAKE_TOOLCHAIN_FILE="$PWD/$TC" \
        -DCMAKE_BUILD_TYPE=Release \
        -DBUILD_SHARED_LIBS=ON \
        -DSDLPAINTER_WITH_VULKAN=ON \
        -DSDLPAINTER_BUILD_EXAMPLES=OFF \
        -DSDLPAINTER_BUILD_TESTS=ON
      cmake --build build/shared/out
    - ctest --test-dir build/shared/out --output-on-failure
    - |
      cmake --install build/shared/out --prefix "$PWD/build/shared/prefix"
      TC=$(find build/shared/generators -name conan_toolchain.cmake | head -1)
      cmake -S packaging/consumer -B build/shared/consumer \
        -DCMAKE_TOOLCHAIN_FILE="$PWD/$TC" \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_PREFIX_PATH="$PWD/build/shared/prefix" \
        -DCONSUMER_MODE=find_package
      cmake --build build/shared/consumer
      LD_LIBRARY_PATH="$PWD/build/shared/prefix/lib:$LD_LIBRARY_PATH" \
        ./build/shared/consumer/consumer

# Conan Center'a gitmeden önce paketleme yolunun erken uyarısı:
# `conan create` + test_package burada kırılırsa görülür.
package:conan-create:
  stage: build
  image: $CI_REGISTRY_IMAGE
  needs: []
  script:
    - |
      conan create . --build=missing \
        -o "&:with_vulkan=False" \
        -o "&:build_examples=False" \
        -o "&:build_tests=False" \
        -c tools.system.package_manager:mode=install \
        -c tools.system.package_manager:sudo=False

# SPIR-V çıktılarının GLSL kaynağıyla senkron olduğunu doğrular.
# glslc GEREKTİRMEZ: karşılaştırma sources.sha256 manifesti üzerinden yapılır.
quality:shader-freshness:
  stage: quality
  image: $CI_REGISTRY_IMAGE
  needs: []
  script:
    - cmake -P cmake/CheckShaderFreshness.cmake

quality:clang-format:
  stage: quality
  image: $CI_REGISTRY_IMAGE
  # Hiçbir build çıktısına ihtiyacı yok (yalnız kaynak lint). needs: [] →
  # pipeline başında hemen çalışsın; alakasız bir build/test fail'i bunu
  # SKIP ettirmesin (allow_failure gate'lenince işe yaramaz).
  needs: []
  # clang-format-18 base imajda zaten kurulu (bkz. Dockerfile builder stage);
  # apt ile yeniden kurmaya gerek yok (imajda apt list'leri silinmiş durumda).
  script:
    - find include/ src/ -name '*.h' -o -name '*.cpp' | xargs clang-format-18 --dry-run --Werror
  # SERT KAPI — allow_failure YOK. GitHub tarafında da öyle; ikisi ayrışırsa
  # biçim ihlali yalnızca bir pipeline'da görünür ve diğerinde birikir.
  # (clang-tidy bilinçli olarak yumuşak kalır: yanlış pozitif üretebiliyor.)

quality:clang-tidy:
  stage: quality
  image: $CI_REGISTRY_IMAGE
  # needs: [] → build artifact'ına bağımlı değil. clang-tidy bir clang
  # frontend'idir; AST kurmak için compile_commands.json (include path'leri) ve
  # Conan bağımlılık header'ları gerekir. Build job'ının artifact'ı bunları
  # taşımadığından (yalnız .a + binary'ler), DB'yi ve header'ları burada kendi
  # conan install + cmake configure adımıyla yeniden üretiyoruz.
  needs: []
  # clang-tidy-18 base imajda zaten kurulu; eski `apt-get install` adımı hem
  # gereksizdi hem de apt-get update + list olmadığı için job'u düşürüyordu.
  #
  # --extra-arg=-Wno-unknown-warning-option: compile_commands.json GCC ile
  # üretildiği için GCC-özel flag'ler (-Wduplicated-cond vb.) içeriyor.
  # clang-tidy clang frontend kullandığından bunları tanımaz; bu sürücü
  # seviyesi diagnostic .clang-tidy Checks filtresiyle bastırılamıyor,
  # yalnız -Wno-... ile susturulabiliyor.
  script:
    - |
      conan install . --output-folder=build/linux-debug/generators --build=missing \
        -s build_type=Debug \
        -o "&:with_vulkan=True" \
        -c tools.system.package_manager:mode=install \
        -c tools.system.package_manager:sudo=False
    - cmake --preset linux-debug
    - find src/ -name '*.cpp' | xargs clang-tidy-18 -p build/linux-debug/ --extra-arg=-Wno-unknown-warning-option
  allow_failure: true

# --- Docs Stage ---

# GitLab Pages: job adı 'pages' olmalı, artifact 'public/' altına gitmeli.
# Conan/CMake gerektirmez — doxygen doğrudan include/ ve doc/ üzerinde çalışır.
pages:
  stage: docs
  image: ubuntu:24.04
  needs: []
  before_script:
    - apt-get update -qq && apt-get install -y doxygen graphviz
  script:
    - mkdir -p public
    # Surumun TEK kaynagi include/sdl_painter/version.h (bkz. build-deps.md).
    # Daha once bu deger CMakeLists.txt'ten grep'leniyordu; project() satiri
    # ${SDLPAINTER_VERSION} degiskenine gecince grep sessizce bosa dustu.
    - |
      SDLPAINTER_VERSION="$(grep -oP 'kVersionString\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' include/sdl_painter/version.h)"
      if [ -z "$SDLPAINTER_VERSION" ]; then
        echo "HATA: version.h icinden surum okunamadi." >&2
        exit 1
      fi
      echo "SDLPainter surumu: $SDLPAINTER_VERSION"
      AWESOME="third_party/doxygen-awesome-css/doxygen-awesome.css"
      [ -f "$AWESOME" ] || AWESOME=""
      cat > _ci_doxyfile <<EOF
      PROJECT_NAME           = "SDLPainter"
      PROJECT_NUMBER         = "${SDLPAINTER_VERSION}"
      PROJECT_BRIEF          = "SDL3 + OpenGL/Vulkan 2B çizim kütüphanesi"
      OUTPUT_DIRECTORY       = public
      HTML_OUTPUT            = .
      INPUT                  = include/sdl_painter doc
      FILE_PATTERNS          = *.h *.md
      RECURSIVE              = YES
      USE_MDFILE_AS_MAINPAGE = doc/README.md
      EXCLUDE_PATTERNS       = */src/* */tests/* */examples/* */third_party/*
      EXTRACT_ALL            = NO
      EXTRACT_PRIVATE        = NO
      EXTRACT_STATIC         = YES
      HIDE_UNDOC_MEMBERS     = YES
      HIDE_UNDOC_CLASSES     = YES
      GENERATE_HTML          = YES
      GENERATE_LATEX         = NO
      HTML_EXTRA_STYLESHEET  = $AWESOME
      HTML_COLORSTYLE        = LIGHT
      HTML_TIMESTAMP         = NO
      HAVE_DOT               = YES
      DOT_IMAGE_FORMAT       = svg
      INTERACTIVE_SVG        = YES
      CLASS_GRAPH            = YES
      COLLABORATION_GRAPH    = NO
      CALL_GRAPH             = NO
      QUIET                  = YES
      WARNINGS               = YES
      WARN_IF_UNDOCUMENTED   = YES
      WARN_NO_PARAMDOC       = YES
      OUTPUT_LANGUAGE        = Turkish
      SEARCHENGINE           = YES
      EOF
    - doxygen _ci_doxyfile
  artifacts:
    paths:
      - public/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --- Release Stage ---
release:publish:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    # CHANGELOG'un tamami yerine yalnizca etiketlenen surumun bolumu.
    # Bolum bulunamazsa script hata verir — bos release notu yayinlanmasin.
    - apk add --no-cache bash >/dev/null 2>&1 || true
    - bash scripts/changelog-section.sh "$CI_COMMIT_TAG" | tee RELEASE_NOTES.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: "SDLPainter $CI_COMMIT_TAG"
    description: ./RELEASE_NOTES.md
