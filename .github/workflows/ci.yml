name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build-linux-debug:
    name: build:linux:debug
    runs-on: ubuntu-latest
    container:
      image: yazilimperver/sdl-painter:ci-v1.0
    env:
      CONAN_HOME: /root/.conan2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: conan install (Debug)
        run: |
          conan install . --output-folder=build/linux-debug/generators --build=missing \
            -s build_type=Debug \
            -o "&:with_vulkan=True" \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=False
      - name: cmake configure & build
        run: |
          cmake --preset linux-debug
          cmake --build --preset linux-debug
      - uses: actions/upload-artifact@v4
        with:
          name: linux-debug
          path: |
            build/linux-debug/libsdl_painter.a
            build/linux-debug/tests/sdl_painter_tests
            build/linux-debug/examples/phase*
          retention-days: 1
          if-no-files-found: warn

  build-linux-release:
    name: build:linux:release
    runs-on: ubuntu-latest
    container:
      image: yazilimperver/sdl-painter:ci-v1.0
    env:
      CONAN_HOME: /root/.conan2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: conan install (Release)
        run: |
          conan install . --output-folder=build/linux-release/generators --build=missing \
            -s build_type=Release \
            -o "&:with_vulkan=True" \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=False
      - name: cmake configure & build
        run: |
          cmake --preset linux-release
          cmake --build --preset linux-release
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            build/linux-release/libsdl_painter.a
            build/linux-release/tests/sdl_painter_tests
            build/linux-release/examples/phase*
          retention-days: 1
          if-no-files-found: warn

  build-windows-debug:
    name: build:windows:debug
    runs-on: windows-2022
    env:
      CONAN_HOME: ${{ github.workspace }}\.conan2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Conan
        run: |
          pip install "conan>=2.0"
          conan profile detect --force
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-windows-debug-${{ hashFiles('conanfile.py', 'conanfile.txt') }}
          restore-keys: |
            conan-windows-debug-
            conan-windows-
      - name: conan install (Debug)
        run: conan install . --output-folder=build/windows-debug/generators --build=missing -s build_type=Debug -s:a compiler.cppstd=17 -o "&:with_vulkan=True"
      - name: cmake configure & build
        run: |
          cmake --preset windows-debug
          cmake --build --preset windows-debug
      # Windows'ta testler daha once HIC kosmuyordu; yalnizca derleniyordu.
      # NOT: offscreen surucusu Windows'ta EGL yukleyemedigi icin renderer
      # smoke testleri burada SKIP olur — Linux tarafinda gercekten kosuyorlar.
      - name: ctest
        env:
          SDL_VIDEODRIVER: offscreen
        run: ctest --preset windows-debug --output-on-failure

  build-windows-release:
    name: build:windows:release
    runs-on: windows-2022
    env:
      CONAN_HOME: ${{ github.workspace }}\.conan2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Conan
        run: |
          pip install "conan>=2.0"
          conan profile detect --force
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-windows-release-${{ hashFiles('conanfile.py', 'conanfile.txt') }}
          restore-keys: |
            conan-windows-release-
            conan-windows-
      - name: conan install (Release)
        run: conan install . --output-folder=build/windows-release/generators --build=missing -s build_type=Release -s:a compiler.cppstd=17 -o "&:with_vulkan=True"
      - name: cmake configure & build
        run: |
          cmake --preset windows-release
          cmake --build --preset windows-release

  test-unit:
    name: test:unit
    runs-on: ubuntu-latest
    needs: [build-linux-debug, build-linux-release]
    container:
      image: yazilimperver/sdl-painter:ci-v1.0
    env:
      CONAN_HOME: /root/.conan2
      SDL_VIDEODRIVER: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # lavapipe ICD dosyasinin adi mesa surumune gore degisiyor
      # (lvp_icd.json / lvp_icd.x86_64.json). Sabit yol yanlissa loader HIC
      # surucu yuklemiyor, surface extension'lari kayboluyor ve Vulkan
      # testleri sessizce SKIP oluyor. Bu yuzden yolu calisma aninda cozuyoruz;
      # bulunamazsa degisken bos kalir ve loader varsayilanina duser.
      - name: Resolve lavapipe ICD
        run: |
          ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1 || true)
          if [ -n "$ICD" ]; then
            echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
            echo "lavapipe ICD: $ICD"
          else
            # Bos degere cekiyoruz: imajin ENV'inde kalmis olabilecek yanlis
            # bir yol yururlukte kalmasin, loader varsayilanina dussun.
            echo "VK_ICD_FILENAMES=" >> "$GITHUB_ENV"
            echo "lavapipe ICD bulunamadi — loader varsayilani kullanilacak"
            ls -la /usr/share/vulkan/icd.d/ || true
          fi
      - name: conan install (Debug)
        run: |
          conan install . --output-folder=build/linux-debug/generators --build=missing \
            -s build_type=Debug \
            -o "&:with_vulkan=True" \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=False
      - name: build & ctest
        run: |
          cmake --preset linux-debug
          cmake --build --preset linux-debug
          ctest --preset linux-debug --output-on-failure

  test-unit-asan:
    name: test:unit:asan
    runs-on: ubuntu-latest
    needs: [build-linux-debug, build-linux-release]
    container:
      image: yazilimperver/sdl-painter:ci-v1.0
    env:
      CONAN_HOME: /root/.conan2
      SDL_VIDEODRIVER: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # lavapipe ICD dosyasinin adi mesa surumune gore degisiyor
      # (lvp_icd.json / lvp_icd.x86_64.json). Sabit yol yanlissa loader HIC
      # surucu yuklemiyor, surface extension'lari kayboluyor ve Vulkan
      # testleri sessizce SKIP oluyor. Bu yuzden yolu calisma aninda cozuyoruz;
      # bulunamazsa degisken bos kalir ve loader varsayilanina duser.
      - name: Resolve lavapipe ICD
        run: |
          ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1 || true)
          if [ -n "$ICD" ]; then
            echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
            echo "lavapipe ICD: $ICD"
          else
            # Bos degere cekiyoruz: imajin ENV'inde kalmis olabilecek yanlis
            # bir yol yururlukte kalmasin, loader varsayilanina dussun.
            echo "VK_ICD_FILENAMES=" >> "$GITHUB_ENV"
            echo "lavapipe ICD bulunamadi — loader varsayilani kullanilacak"
            ls -la /usr/share/vulkan/icd.d/ || true
          fi
      - name: conan install (Debug, ASan)
        run: |
          conan install . --output-folder=build/linux-debug-asan/generators --build=missing \
            -s build_type=Debug \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=False
      - name: build & ctest (ASan/UBSan)
        run: |
          cmake --preset linux-debug-asan
          cmake --build --preset linux-debug-asan
          ctest --preset linux-debug-asan --output-on-failure

  # Faz 1.3 — Conan Center CMake'i preset kullanmadan surer. Preset'ler Conan
  # toolchain yolunu hardcode ettigi icin bu yol ayrica dogrulanmali; kirilirsa
  # paketleme kirilir ama normal build yesil kalir.
  build-standalone-cmake:
    name: build:standalone-cmake
    runs-on: ubuntu-latest
    needs: [build-linux-debug]
    container:
      image: yazilimperver/sdl-painter:ci-v1.0
    env:
      CONAN_HOME: /root/.conan2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: conan install
        run: |
          conan install . --output-folder=build/standalone/generators --build=missing \
            -s build_type=Release \
            -o "&:with_vulkan=True" \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=False
      - name: configure & build (preset YOK, ornek/test KAPALI)
        run: |
          TC=$(find build/standalone/generators -name conan_toolchain.cmake | head -1)
          echo "toolchain: $TC"
          cmake -S . -B build/standalone/out \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/$TC" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDLPAINTER_WITH_VULKAN=ON \
            -DSDLPAINTER_BUILD_EXAMPLES=OFF \
            -DSDLPAINTER_BUILD_TESTS=OFF
          cmake --build build/standalone/out
      - name: install + tuketici dogrulamasi
        run: |
          cmake --install build/standalone/out --prefix "$PWD/build/standalone/prefix"
          TC=$(find build/standalone/generators -name conan_toolchain.cmake | head -1)
          cmake -S packaging/consumer -B build/standalone/consumer \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/$TC" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/build/standalone/prefix" \
            -DCONSUMER_MODE=find_package
          cmake --build build/standalone/consumer
          ./build/standalone/consumer/consumer

  # Faz 1.5 — SPIR-V ciktilarinin GLSL kaynagiyla senkron oldugunu dogrular.
  # glslc GEREKTIRMEZ: karsilastirma sources.sha256 manifesti uzerinden yapilir.
  quality-shader-freshness:
    name: quality:shader-freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SPIR-V guncel mi
        run: cmake -P cmake/CheckShaderFreshness.cmake

  # Faz 1.5 — paketleme yolunun erken uyari sistemi. Conan Center'a gitmeden
  # once `conan create` + test_package burada kirilirsa gorulur.
  package-conan-create:
    name: package:conan-create
    runs-on: ubuntu-latest
    needs: [build-linux-debug]
    container:
      image: yazilimperver/sdl-painter:ci-v1.0
    env:
      CONAN_HOME: /root/.conan2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: conan create + test_package
        run: |
          conan create . --build=missing \
            -o "&:with_vulkan=False" \
            -o "&:build_examples=False" \
            -o "&:build_tests=False" \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=False

  quality-clang-format:
    name: quality:clang-format
    runs-on: ubuntu-latest
    needs: [test-unit, test-unit-asan]
    container:
      image: yazilimperver/sdl-painter:ci-v1.0
    steps:
      - uses: actions/checkout@v4
      # Zorunlu: CONTRIBUTING.md "format kontrolu zorunludur" diyor, CI de
      # oyle davranmali. Duzeltmek icin: ./scripts/format-check.sh --fix
      # Kapsam bilincli olarak include/ + src/ ile sinirli. tests/ altindaki
      # dosyalar bugune kadar hic kontrol edilmedigi icin 8 dosyada 67 ihlal
      # birikmis; kapsami genisletmek once o dosyalarin formatlanmasini
      # gerektirir (ayri bir temizlik isi).
      - name: clang-format --dry-run --Werror
        run: find include/ src/ -name '*.h' -o -name '*.cpp' | xargs clang-format-18 --dry-run --Werror

  quality-clang-tidy:
    name: quality:clang-tidy
    runs-on: ubuntu-latest
    needs: [test-unit, test-unit-asan]
    container:
      image: yazilimperver/sdl-painter:ci-v1.0
    env:
      CONAN_HOME: /root/.conan2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: conan install + build (Debug)
        run: |
          conan install . --output-folder=build/linux-debug/generators --build=missing \
            -s build_type=Debug \
            -o "&:with_vulkan=True" \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=False
          cmake --preset linux-debug
          cmake --build --preset linux-debug
      - name: clang-tidy
        continue-on-error: true
        run: find src/ -name '*.cpp' | xargs clang-tidy-18 -p build/linux-debug/ --extra-arg=-Wno-unknown-warning-option

  docs:
    name: docs
    runs-on: ubuntu-latest
    needs: [quality-clang-format, quality-clang-tidy]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install doxygen (resmi binary — Mermaid native desteği için)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y graphviz jq
          asset_url=$(curl -sL https://api.github.com/repos/doxygen/doxygen/releases/latest \
            | jq -r '.assets[] | select(.name | endswith("linux.bin.tar.gz")) | .browser_download_url')
          if [ -z "$asset_url" ]; then
            echo "Doxygen linux.bin.tar.gz asset'i bulunamadı" >&2
            exit 1
          fi
          curl -sL "$asset_url" -o /tmp/doxygen.tar.gz
          mkdir -p /tmp/doxygen-install
          tar -xzf /tmp/doxygen.tar.gz -C /tmp/doxygen-install --strip-components=1
          echo "/tmp/doxygen-install/bin" >> "$GITHUB_PATH"
      - name: doxygen sürüm kontrolü
        run: doxygen --version
      - name: Generate docs
        run: |
          mkdir -p public
          AWESOME="third_party/doxygen-awesome-css/doxygen-awesome.css"
          [ -f "$AWESOME" ] || AWESOME=""
          cat > _ci_doxyfile <<EOF
          PROJECT_NAME           = "SDLPainter"
          PROJECT_NUMBER         = "$(grep 'project(SDLPainter VERSION' CMakeLists.txt | grep -oP '\d+\.\d+\.\d+')"
          PROJECT_BRIEF          = "QPainter benzeri SDL3 + OpenGL/Vulkan 2D çizim kütüphanesi"
          OUTPUT_DIRECTORY       = public
          HTML_OUTPUT            = .
          INPUT                  = include/sdl_painter doc
          FILE_PATTERNS          = *.h *.md
          RECURSIVE              = YES
          USE_MDFILE_AS_MAINPAGE = doc/README.md
          EXCLUDE_PATTERNS       = */src/* */tests/* */examples/* */third_party/*
          EXTRACT_ALL            = NO
          EXTRACT_PRIVATE        = NO
          EXTRACT_STATIC         = YES
          HIDE_UNDOC_MEMBERS     = YES
          HIDE_UNDOC_CLASSES     = YES
          GENERATE_HTML          = YES
          GENERATE_LATEX         = NO
          HTML_EXTRA_STYLESHEET  = $AWESOME
          HTML_COLORSTYLE        = LIGHT
          HTML_TIMESTAMP         = NO
          HAVE_DOT               = YES
          DOT_IMAGE_FORMAT       = svg
          INTERACTIVE_SVG        = YES
          CLASS_GRAPH            = YES
          COLLABORATION_GRAPH    = NO
          CALL_GRAPH             = NO
          QUIET                  = YES
          WARNINGS               = YES
          WARN_IF_UNDOCUMENTED   = YES
          WARN_NO_PARAMDOC       = YES
          OUTPUT_LANGUAGE        = Turkish
          SEARCHENGINE           = YES
          EOF
          doxygen _ci_doxyfile
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: release:publish
    runs-on: ubuntu-latest
    needs: [quality-clang-format, quality-clang-tidy]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SDLPainter ${{ github.ref_name }}
          body_path: CHANGELOG.md
